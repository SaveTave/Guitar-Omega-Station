<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GUITAR OMEGA v27 (STABLE BOX)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 95 C 20 95 5 60 5 30 Q 5 5 50 5 Q 95 5 95 30 C 95 60 80 95 50 95' fill='%2300ffcc'/><text x='50' y='65' font-family='sans-serif' font-size='40' text-anchor='middle' fill='black' font-weight='bold'>G</text></svg>">
    
    <style>
        /* --- THEME: QUANTUM GHOST --- */
        :root {
            --bg: #050505;
            --panel: #111;
            --primary: #00ffcc; /* Verde Acqua */
            --secondary: #d400ff; /* Viola Elettrico */
            --gold: #ffd700;
            --text: #fff;
        }

        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', monospace; margin: 0; padding: 20px;
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* --- TABS --- */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            background: #151515; border: 1px solid #333; color: #888; padding: 12px;
            cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 4px; flex: 1; text-align: center;
        }
        .tab-btn.active { background: var(--primary); color: black; border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }

        /* --- CONTROLS --- */
        .controls {
            background: #111; border-top: 4px solid var(--secondary);
            padding: 15px; border-radius: 8px; margin-bottom: 20px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        
        .hidden { display: none !important; }
        .c-group { display: flex; flex-direction: column; gap: 5px; min-width: 130px; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }

        select, button {
            background: #000; color: var(--primary); border: 1px solid #333;
            padding: 10px; font-weight: bold; font-family: inherit; font-size: 13px;
            border-radius: 4px; cursor: pointer; text-transform: uppercase; height: 40px;
        }
        select:hover, button:hover { border-color: var(--primary); color: #fff; background: #222; }
        
        select#boxSelect.box-active { background: var(--secondary); color: white; border-color: white; }

        .btn-play { background: #222; border-color: var(--gold); color: var(--gold); min-width: 150px; }
        .btn-play:hover { background: var(--gold); color: black; }

        /* --- VISUALIZER --- */
        .vis-container {
            background: var(--panel); border: 1px solid #333; padding: 30px 0;
            border-radius: 8px; overflow-x: auto; margin-bottom: 25px;
            position: relative; box-shadow: inset 0 0 50px #000;
        }

        .fretboard { display: grid; grid-template-rows: repeat(6, 40px); min-width: 1300px; position: relative; padding-left: 20px; }
        .string { display: flex; align-items: center; position: relative; }
        .string::before { content:''; position: absolute; width:100%; height:2px; background:#444; z-index:0; }
        
        .note {
            width: 50px; height: 32px; margin-right: 2px; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            border-right: 2px solid #333; font-size: 11px; font-weight: bold; color: #555;
            position: relative; transition: 0.2s; border-radius: 4px; background: transparent;
        }
        
        /* NOTE STATES */
        .note.active { background: #222; color: var(--primary); border: 1px solid var(--primary); }
        
        .note.in-box { 
            background: var(--secondary) !important; color: white !important; 
            border: 1px solid white; transform: scale(1.1); z-index: 30; 
            box-shadow: 0 0 15px var(--secondary);
        }
        
        .note.ghost { 
            opacity: 0.25; color: var(--primary);
            border: 1px dashed var(--primary); 
            transform: scale(0.9); filter: grayscale(0.5);
        }
        
        .note.root { background: var(--primary) !important; color: #000 !important; font-weight: 900; z-index: 20; border:none;}
        .note.ghost.root { background: transparent !important; color: var(--primary) !important; border: 2px solid var(--primary) !important; opacity: 0.4; }

        /* --- PANELS --- */
        .grid-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .panel { background: var(--panel); padding: 20px; border-radius: 8px; border: 1px solid #333; }
        h2 { margin: 0 0 15px 0; color: white; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 16px; }

        /* Harmonization */
        .harm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; margin-top: 15px; }
        .harm-btn {
            background: #111; border: 1px solid #444; padding: 10px 5px; text-align: center;
            border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s;
        }
        .harm-btn:hover { border-color: var(--primary); color: var(--primary); }
        .harm-btn.selected { background: var(--secondary); color: white; border-color: var(--secondary); }
        .harm-degree { font-size: 9px; color: #888; display: block; margin-bottom: 2px; }

        /* Chord Scroller */
        .chord-scroller { display: flex; gap: 20px; overflow-x: auto; padding: 10px 0; min-height: 220px; }
        .chord-card { 
            background: #181818; border: 1px solid #333; border-radius: 6px; padding: 15px; 
            min-width: 150px; text-align: center;
        }
        .chord-name { color: var(--primary); font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .chord-sub { color: #888; font-size: 11px; margin-bottom: 10px; }
        svg.chord-svg { background: white; border-radius: 3px; display: block; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        @media print {
            body { background: white !important; color: black !important; zoom: 70%; }
            .controls, .tabs, button { display: none !important; }
            .vis-container, .panel, .chord-card { background: white !important; border: 1px solid #ccc !important; }
            .note.active { background: #eee !important; color: black !important; border: 1px solid black !important; }
        }
    </style>
</head>
<body>

    <div class="vis-container">

        <div style="display:flex; padding-left:20px; margin-top:5px;">

    <div id="panel-scale" class="grid-layout">
        <div class="panel">

<script>
    const notes = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
    const strings = ["E", "B", "G", "D", "A", "E"]; 

    // --- FREQUENZE BASE ---
    const FREQS = {
        "C": 261.63, "C#": 277.18, "D": 293.66, "Eb": 311.13, "E": 329.63, "F": 349.23,
        "F#": 369.99, "G": 392.00, "G#": 415.30, "A": 440.00, "Bb": 466.16, "B": 493.88

    // --- DATABASE ---

        { id: "pent_min", name: "Pentatonica Min", genre: "blues", intervals: [0,3,5,7,10], harm:"penta", desc: "La scala della chitarra rock." },
        { id: "pent_maj", name: "Pentatonica Magg", genre: "blues", intervals: [0,2,4,7,9], harm:"penta", desc: "Country/Pop. Felice." },
        { id: "blues", name: "Scala Blues", genre: "blues", intervals: [0,3,5,6,7,10], harm:"penta", desc: "Pentatonica + Blue Note." },
        { id: "harm_minor", name: "Minore Armonica", genre: "metal", intervals: [0,2,3,5,7,8,11], harm:"harmonic", desc: "Neoclassico / Yngwie." },
        { id: "mel_minor", name: "Minore Melodica", genre: "jazz", intervals: [0,2,3,5,7,9,11], harm:"melodic", desc: "Jazz Minor." },
        { id: "lydian_dom", name: "Lidia Dominante", genre: "jazz", intervals: [0,2,4,6,7,9,10], harm:"dom", desc: "Modo IV Melodica (7#11)." },
        { id: "altered", name: "Alterata", genre: "jazz", intervals: [0,1,3,4,6,8,10], harm:"alt", desc: "Modo VII Melodica (Superlocria)." },
        { id: "whole_tone", name: "Esatonale", genre: "jazz", intervals: [0,2,4,6,8,10], harm:"aug", desc: "Simmetrica. Fluttuante." },
        { id: "dim_hw", name: "Diminuita (S-T)", genre: "symm", intervals: [0,1,3,4,6,7,9,10], harm:"dim", desc: "Simmetrica ottatonica." },
        { id: "romanian", name: "Rumena", genre: "exotic", intervals: [0,2,3,6,7,9,10], harm:"minor", desc: "Dorica #4. Folk." },
        { id: "hungarian", name: "Ungherese Minore", genre: "exotic", intervals: [0,2,3,6,7,8,11], harm:"harmonic", desc: "Gitana." },
        { id: "double_harm", name: "Doppia Armonica", genre: "exotic", intervals: [0,1,4,5,7,8,11], harm:"major", desc: "Araba / Pulp Fiction." },
        { id: "hirajoshi", name: "Hirajoshi", genre: "exotic", intervals: [0,2,3,7,8], harm:"penta", desc: "Giapponese." },
        { id: "neapolitan", name: "Napoletana Min", genre: "exotic", intervals: [0,1,3,5,7,8,11], harm:"minor", desc: "Minore Armonica con b2." }
    ];

    // --- ACCORDI ---
    const chordLib = {
        "Maj": [
            {n:"E-Shape (Barrè)",o:[0,2,2,1,0,0],r:5}, {n:"A-Shape (Barrè)",o:[-1,0,2,2,2,0],r:4}, {n:"C-Shape",o:[-1,3,2,0,1,0],r:4}, {n:"D-Shape",o:[-1,-1,0,2,3,2],r:3}, {n:"G-Shape",o:[3,2,0,0,0,3],r:5},
            {n:"Triad (Top 3)", o:[-1,-1,-1,0,1,0], r:2} 
        ],
        "m": [
            {n:"Em-Shape",o:[0,2,2,0,0,0],r:5}, {n:"Am-Shape",o:[-1,0,2,2,1,0],r:4}, {n:"Dm-Shape",o:[-1,-1,0,2,3,1],r:3}, {n:"Gm-Shape",o:[3,5,5,3,3,3],r:5}, {n:"Cm-Shape",o:[-1,3,1,3,4,3],r:4},
            {n:"Triad (Top 3)", o:[-1,-1,-1,0,1,0], r:2}
        ],
        "5": [{n:"Power Chord (E)", o:[0,2,2,-1,-1,-1], r:5}, {n:"Power Chord (A)", o:[-1,0,2,2,-1,-1], r:4}],
        "dim": [{n:"Triad (Top 3)", o:[-1,-1,-1,0,1,0], r:3}, {n:"E-String Root", o:[0,1,2,-1,-1,-1], r:5}],
        "aug": [{n:"E-Shape (+)", o:[0,3,2,1,1,0], r:5}, {n:"A-Shape (+)", o:[-1,0,3,2,2,1], r:4}],
        "7": [{n:"E7-Shape",o:[0,2,0,1,0,0],r:5}, {n:"A7-Shape",o:[-1,0,2,0,2,0],r:4}, {n:"C7-Shape",o:[-1,3,2,3,1,0],r:4}, {n:"D7-Shape",o:[-1,-1,0,2,1,2],r:3}, {n:"G7-Shape",o:[3,2,0,0,0,1],r:5},
            {n:"Shell (Jazz)", o:[0,-1,0,1,-1,-1], r:5}],
        "Maj7": [{n:"E-Shape",o:[0,-1,1,1,0,-1],r:5}, {n:"A-Shape",o:[-1,0,2,1,2,0],r:4}, {n:"C-Shape",o:[-1,3,2,0,0,0],r:4}, {n:"D-Shape",o:[-1,-1,0,2,2,2],r:3},
            {n:"Shell (Jazz)", o:[0,-1,1,1,-1,-1], r:5}],
        "m7": [{n:"Em-Shape",o:[0,2,0,0,0,0],r:5}, {n:"Am-Shape",o:[-1,0,2,0,1,0],r:4}, {n:"Cm-Shape",o:[-1,3,1,3,4,3],r:4}, {n:"Dm-Shape",o:[-1,-1,0,2,1,1],r:3},
            {n:"Shell (Jazz)", o:[0,-1,0,0,-1,-1], r:5}],
        "mMaj7": [{n:"E-Shape (Spy)", o:[0,-1,1,0,0,-1], r:5}, {n:"A-Shape", o:[-1,0,2,1,1,0], r:4}],
        "m7b5": [{n:"E-Root",o:[0,1,0,0,-1,-1],r:5}, {n:"A-Root",o:[-1,0,1,0,1,-1],r:4}],
        "dim7": [{n:"E-Root",o:[0,-1,1,2,1,-1],r:5}, {n:"A-Root",o:[-1,0,1,0,1,-1],r:4}],
        "sus2": [{n:"A-Shape",o:[-1,0,2,2,0,0],r:4}, {n:"D-Shape",o:[-1,-1,0,2,3,0],r:3}],
        "sus4": [{n:"E-Shape",o:[0,2,2,2,0,0],r:5}, {n:"A-Shape",o:[-1,0,2,2,3,0],r:4}],
        "7sus4": [{n:"Maiden Voyage", o:[-1,0,2,0,3,0], r:4}],
        "6": [{n:"E-Shape",o:[0,-1,2,2,2,-1],r:5}, {n:"A-Shape",o:[-1,0,4,2,2,-1],r:4}],
        "69": [{n:"6/9 (A-Root)",o:[-1,0,1,1,2,2],r:4}],
        "9": [{n:"Funk E9",o:[-1,2,1,2,2,2],r:4}, {n:"C9 Shape",o:[-1,3,2,3,3,-1],r:4}],
        "Maj9": [{n:"A-Root Maj9",o:[-1,0,2,1,2,0],r:4}],
        "m9": [{n:"A-Root m9",o:[-1,0,2,0,1,0],r:4}],
        "add9": [{n:"Cadd9",o:[-1,3,2,0,3,0],r:4}, {n:"Eadd9",o:[0,2,4,1,0,0],r:5}],
        "11": [{n:"m11 (Funk)",o:[0,-1,0,0,0,0],r:5}],
        "13": [{n:"Dom 13",o:[0,-1,0,1,2,2],r:5}],
        "7s9": [{n:"Hendrix (7#9)",o:[-1,2,1,2,3,-1],r:4}],
        "Maj7s11": [{n:"Lydian",o:[-1,0,1,1,0,-1],r:5}]
    };

    // --- AUDIO ENGINE ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSimpleAudio() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const root = document.getElementById('rootSelect').value;
        const scale = scalesDB.find(s => s.id === document.getElementById('scaleSelect').value);
        const rootIndex = notes.indexOf(root);
        const now = audioCtx.currentTime;

        scale.intervals.forEach((interval, i) => {
            const noteIndex = (rootIndex + interval) % 12;
            const noteName = notes[noteIndex];
            
            let freq = FREQS[noteName];
            if (notes.indexOf(noteName) < rootIndex && interval !== 0) freq *= 2;
            if (interval >= 12) freq *= 2;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const start = now + (i * 0.4);
            gain.gain.setValueAtTime(0.2, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
            osc.start(start);
            osc.stop(start + 0.4);
        });
        
        const fOsc = audioCtx.createOscillator();
        const fGain = audioCtx.createGain();
        fOsc.type = 'triangle';
        fOsc.frequency.value = FREQS[root] * 2;
        fOsc.connect(fGain);
        fGain.connect(audioCtx.destination);
        const end = now + (scale.intervals.length * 0.4);
        fGain.gain.setValueAtTime(0.2, end);
        fGain.gain.exponentialRampToValueAtTime(0.001, end + 0.6);
        fOsc.start(end);
        fOsc.stop(end + 0.6);
    }

    // --- LOGIC ---
    function init() {
        const rSel = document.getElementById('rootSelect');
        const dSel = document.getElementById('dictRoot');
        notes.forEach(n => {
            rSel.innerHTML += `<option value="${n}">${n}</option>`;
            dSel.innerHTML += `<option value="${n}">${n}</option>`;
        });
        updateScalesList();
    }

    function switchMode(mode) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-btn')[mode==='scale'?0:1].classList.add('active');
        document.getElementById('controls-scale').classList.toggle('hidden', mode!=='scale');
        document.getElementById('controls-dictionary').classList.toggle('hidden', mode!=='dictionary');
        document.getElementById('panel-scale').classList.toggle('hidden', mode!=='scale');
        document.getElementById('panel-dictionary').classList.toggle('hidden', mode!=='dictionary');
        if(mode === 'dictionary') renderDictionary(); else renderScale();
    }

    function updateScalesList() {
        const genre = document.getElementById('genreSelect').value;
        const sSel = document.getElementById('scaleSelect');
        sSel.innerHTML = "";
        scalesDB.forEach(s => {
            if(genre === 'all' || s.genre === genre) sSel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
        });
        renderScale();
    }

    // --- LOGICA BOX V24 (RIPRISTINATA) ---
    function isNoteInBox(stringIdx, fret, root, boxVal) {
        if (boxVal === 'none') return true;
        
        const rootOnE = (notes.indexOf(root) - notes.indexOf("E") + 12) % 12;
        // Offset standard della v24: 0, 2, 5, 7, 9
        const boxOffsets = [0, 2, 5, 7, 9];
        const boxWidth = 4;
        
        let startFret = rootOnE + boxOffsets[boxVal];
        let endFret = startFret + boxWidth;
        
        // Check normal
        if (fret >= startFret && fret <= endFret) return true;
        // Check octave up
        if (fret >= (startFret + 12) && fret <= (endFret + 12)) return true;
        // Check octave down
        if (fret >= (startFret - 12) && fret <= (endFret - 12)) return true;
        
        return false;
    }

    function renderScale() {
        const root = document.getElementById('rootSelect').value;
        const scale = scalesDB.find(s => s.id === document.getElementById('scaleSelect').value);
        const boxVal = document.getElementById('boxSelect').value;
        document.getElementById('boxSelect').className = boxVal !== 'none' ? 'box-active' : '';

        if(!scale) return;

        document.getElementById('scaleTitle').innerText = `${root} ${scale.name}`;
        document.getElementById('scaleDesc').innerText = scale.desc;

        const activeNotes = scale.intervals.map(i => {
            const n = notes[(notes.indexOf(root)+i)%12];
            const map = {0:"R",1:"b2",2:"2",3:"b3",4:"3",5:"4",6:"b5",7:"5",8:"b6",9:"6",10:"b7",11:"7"};
            return {note:n, label:map[i]||""};
        });
        document.getElementById('intervalsDisplay').innerText = activeNotes.map(x=>x.label).join(" - ");

        // RENDER FRETBOARD
        let html = "";
        strings.forEach((s, sIdx) => {
            html += `<div class="string">`;
            for(let f=0; f<=24; f++) {
                const cn = notes[(notes.indexOf(s)+f)%12];
                const found = activeNotes.find(x=>x.note===cn);
                
                let cls = "note";
                let content = "";
                
                if(found) {
                    const inBox = isNoteInBox(sIdx, f, root, boxVal);
                    if (boxVal === 'none') {
                        cls += " active";
                    } else {
                        if (inBox) cls += " in-box";
                        else cls += " ghost";
                    }
                    if(cn===root) {
                        cls += " root";
                        if(!inBox && boxVal !== 'none') cls += " ghost"; 
                    }
                    content = cn===root ? "R" : found.label;
                }
                html += `<div class="${cls}">${content}</div>`;
            }
            html += `</div>`;
        });
        document.getElementById('fretboard').innerHTML = html;

        renderHarmonization(root, scale);
    }

    function renderHarmonization(root, scale) {
        const container = document.getElementById('harmGrid');
        const degrees = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
        let types = [];
        
        if(scale.harm === "major") types = ["Maj7", "m7", "m7", "Maj7", "7", "m7", "m7b5"];
        else if(scale.harm === "minor") types = ["m7", "m7b5", "Maj7", "m7", "m7", "Maj7", "7"];
        else if(scale.harm === "melodic") types = ["mMaj7", "m7", "Maj7#5", "7", "7", "m7b5", "m7b5"];
        else if(scale.harm === "harmonic") types = ["mMaj7", "m7b5", "Maj7#5", "m7", "7", "Maj7", "dim7"];
        else if(scale.harm === "dorian") types = ["m7", "m7", "Maj7", "7", "m7", "m7b5", "Maj7"];
        else if(scale.harm === "aug") types = ["aug", "aug", "aug", "aug", "aug", "aug", "aug"];
        else types = ["5", "5", "5", "5", "5", "5", "5"];

        let html = "";
        scale.intervals.forEach((i, idx) => {
            if(idx >= types.length) return;
            const n = notes[(notes.indexOf(root)+i)%12];
            const t = types[idx] || "";
            html += `<div class="harm-btn" onclick="drawChordsInContainer('${n}', '${t}', 'chordContainer')">
                        <span class="harm-degree">${degrees[idx]}</span> ${n}${t}
                     </div>`;
        });
        container.innerHTML = html;
    }

    function renderDictionary() {
        const root = document.getElementById('dictRoot').value;
        const type = document.getElementById('dictType').value;
        drawChordsInContainer(root, type, 'dictContainer');
    }

    function drawChordsInContainer(root, type, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        
        let search = type;
        if(type.includes("mMaj7")) search = "mMaj7"; 
        let shapes = chordLib[search];
        if(!shapes && type.includes("7")) shapes = chordLib["7"];
        if(!shapes && type.includes("m")) shapes = chordLib["m"];
        if(!shapes && type.includes("Maj")) shapes = chordLib["Maj"];

        if(!shapes) { container.innerHTML="<div style='padding:20px'>Nessun diagramma disponibile.</div>"; return; }

        shapes.forEach(shape => {
            const card = document.createElement("div");
            card.className = "chord-card";
            card.innerHTML = `<div class="chord-name">${root}${type}</div><div class="chord-sub">${shape.n}</div>`;
            const stringOpenNote = strings[5 - shape.r];
            const fret = (notes.indexOf(root) - notes.indexOf(stringOpenNote) + 12) % 12;
            card.appendChild(createSVG(shape.o, fret));
            container.appendChild(card);
        });
    }

    function createSVG(offsets, startFret) {
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("width", 100); svg.setAttribute("height", 120);
        svg.setAttribute("class", "chord-svg");
        for(let i=0; i<6; i++) {
            const x=15+i*14; const l=document.createElementNS(ns,"line");
            l.setAttribute("x1",x); l.setAttribute("y1",15); l.setAttribute("x2",x); l.setAttribute("y2",95); l.setAttribute("stroke","#333"); svg.appendChild(l);
        }
        for(let i=0; i<6; i++) {
            const y=15+i*16; const l=document.createElementNS(ns,"line");
            l.setAttribute("x1",15); l.setAttribute("y1",y); l.setAttribute("x2",85); l.setAttribute("y2",y); l.setAttribute("stroke","#333"); 
            if(i==0 && startFret==0) l.setAttribute("stroke-width",3); svg.appendChild(l);
        }
        offsets.forEach((off, idx) => {
            const x = 15 + idx * 14;
            if(off === -1) {
                const t = document.createElementNS(ns,"text"); t.setAttribute("x",x); t.setAttribute("y",10); t.setAttribute("text-anchor","middle"); t.setAttribute("fill","red"); t.setAttribute("font-size",8); t.textContent="X"; svg.appendChild(t);
            } else if (off === 0 && startFret === 0) {
                const c = document.createElementNS(ns,"circle"); c.setAttribute("cx",x); c.setAttribute("cy",8); c.setAttribute("r",2); c.setAttribute("stroke","black"); c.setAttribute("fill","none"); svg.appendChild(c);
            } else {
                const y = 15 + (off * 16) - 8; const c = document.createElementNS(ns,"circle"); c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",4); c.setAttribute("fill","black"); svg.appendChild(c);
            }
        });
        if(startFret > 0) {
            const t = document.createElementNS(ns,"text"); t.setAttribute("x",0); t.setAttribute("y",35); t.setAttribute("font-size",10); t.textContent=startFret; svg.appendChild(t);
        }
        return svg;
    }

    init();
</script>
